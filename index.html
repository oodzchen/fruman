<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SL2D Game</title>
    <style>
      :root {
        --ui-font: monospace;
        --ui-color: #ffffff;
        --ui-muted: #aaaaaa;
        --ui-dim: rgba(11, 12, 14, 0.2);
        --ui-highlight: rgba(128, 128, 128, 0.8);
      }
      body {
        margin: 0;
        padding: 5px;
        overflow: hidden;
      }
      body.is-mobile-game {
        padding: 0;
        background: #0d0b18;
      }
      body.is-mobile-game #canvasBottom,
      body.is-mobile-game #controlPanel {
        display: none !important;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) rgba(0, 0, 0, 0.2);
      }
      #gameContainer {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
      }
      #gameContainer.is-development {
        justify-content: flex-start;
      }
      canvas {
        flex-shrink: 0;
        display: block;
      }
      #canvasColumn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        flex-shrink: 0;
      }
      #gameViewport {
        position: relative;
        width: 800px;
        height: 600px;
        flex-shrink: 0;
        overflow: hidden;
        background: #0d0b18;
      }
      #gameViewport:fullscreen {
        width: 100% !important;
        height: 100% !important;
      }
      #gameViewport.is-mobile-game {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
      }
      #gameViewport.is-mobile-game .menu-title {
        max-width: calc(100% - 24px);
        font-size: clamp(32px, 12vw, 80px);
      }
      #gameViewport.is-mobile-game .menu-item {
        width: min(300px, calc(100% - 32px));
        height: clamp(22px, 7vmin, 26px);
        line-height: clamp(22px, 7vmin, 26px);
        font-size: clamp(12px, 4vmin, 16px);
      }
      #gameViewport.is-mobile-game .menu-item.menu-item-back {
        width: max-content;
        white-space: nowrap;
      }
      #gameViewport.is-mobile-game .menu-save-actions .menu-item {
        width: max-content;
        max-width: none;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #gameViewport.is-mobile-game .menu-item.menu-item-value,
      #gameViewport.is-mobile-game .menu-item.menu-item-cycle {
        width: min(340px, calc(100% - 24px));
        grid-template-columns: minmax(90px, 1fr) 8px minmax(110px, 1fr);
        gap: 4px;
      }
      #gameViewport.is-mobile-game .menu-save-list-container {
        width: calc(100% - 24px);
        max-height: calc(100% - 80px);
        padding: 10px 12px;
      }
      #gameViewport.is-mobile-game .menu-save-list-title {
        font-size: clamp(14px, 5vmin, 20px);
      }
      #gameViewport.is-mobile-game .menu-save-list .menu-item.menu-item-save {
        width: 100%;
      }
      #gameCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: none;
      }
      .ui-layer.is-interactive {
        display: block;
        pointer-events: auto;
      }
      .ui-text-muted {
        color: var(--ui-muted);
      }
      .menu-overlay {
        position: absolute;
        inset: 0;
        font-family: var(--ui-font);
        color: var(--ui-color);
        opacity: 0;
        pointer-events: none;
      }
      .menu-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }
      .menu-dim {
        position: absolute;
        inset: 0;
        background: var(--ui-dim);
      }
      .menu-title {
        position: absolute;
        left: 50%;
        font-size: 150px;
        font-weight: bold;
        line-height: 1;
        transform: translate(-50%, -50%);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }
      .menu-title.menu-title-compact {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .menu-items {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .menu-save-list-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-sizing: border-box;
        pointer-events: auto;
        max-height: calc(100% - 140px);
      }
      .menu-save-list-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
      }
      .menu-save-list {
        position: relative;
        display: block;
        gap: 0;
        max-height: calc(100% - 60px);
        overflow: auto;
      }
      .menu-save-list .menu-item {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        text-align: left;
        margin: 0 auto;
      }
      .menu-save-list .menu-item.menu-item-save {
        width: 600px;
      }
      .menu-save-actions {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: none;
        gap: 8px;
        pointer-events: auto;
        z-index: 4;
      }
      .menu-save-actions.is-visible {
        display: flex;
      }
      .menu-save-actions .menu-item {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
      }
      .menu-item.menu-item-save-new {
        position: relative;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        box-sizing: border-box;
        width: auto;
        transform: none;
        left: auto;
      }
      .menu-item.menu-item-save-delete {
        position: relative;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        color: #d98b8b;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(190, 68, 68, 0.8);
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        box-sizing: border-box;
        width: auto;
        transform: none;
        left: auto;
      }
      .menu-item.menu-item-save-new:hover,
      .menu-item.menu-item-save-new.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .menu-item.menu-item-save-delete:hover,
      .menu-item.menu-item-save-delete.is-selected {
        color: #ffd0d0;
        background: var(--ui-highlight);
        border-color: rgba(245, 92, 92, 0.95);
      }
      .menu-item.menu-item-save-delete:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .menu-item.menu-item-back {
        position: absolute;
        left: 12px;
        bottom: 12px;
        transform: none;
      }
      .menu-item {
        position: absolute;
        left: 50%;
        width: 300px;
        height: 30px;
        line-height: 30px;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: var(--ui-muted);
        background: transparent;
        border: none;
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        pointer-events: auto;
      }
      .menu-item.menu-item-value {
        width: 420px;
        display: grid;
        grid-template-columns: 148px 12px 1fr;
        align-items: center;
        gap: 8px;
        text-align: left;
      }
      .menu-item.menu-item-cycle {
        grid-template-columns: 148px 12px 1fr;
      }
      .menu-item-value-label {
        text-align: right;
        pointer-events: none;
      }
      .menu-item-value-colon {
        text-align: center;
        pointer-events: none;
      }
      .menu-item-value-content {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
      }
      .menu-item-static-value {
        pointer-events: none;
      }
      .menu-item-cycle-controls {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        min-width: 144px;
      }
      .menu-item-cycle-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: var(--ui-muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: auto;
      }
      .menu-item:hover .menu-item-cycle-arrow,
      .menu-item.is-selected .menu-item-cycle-arrow {
        color: var(--ui-color);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .menu-item-cycle-value {
        min-width: 80px;
        text-align: center;
        pointer-events: none;
      }
      .menu-item.menu-item-back {
        width: auto;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
      }
      .menu-item.menu-item-back.is-selected,
      .menu-item.menu-item-back:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .menu-item.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      /* Small screen compact styles */
      .menu-overlay.menu-compact .menu-title {
        font-size: 80px;
      }
      .menu-overlay.menu-compact .menu-item {
        font-size: 16px;
        height: 26px;
        line-height: 26px;
      }
      .menu-overlay.menu-compact .menu-item.menu-item-value,
      .menu-overlay.menu-compact .menu-item.menu-item-cycle {
        width: 340px;
        grid-template-columns: 116px 10px 1fr;
        gap: 6px;
      }
      .menu-overlay.menu-compact .menu-item-cycle-controls {
        min-width: 118px;
      }
      .menu-overlay.menu-compact .menu-item-cycle-arrow {
        width: 20px;
        height: 20px;
      }
      .menu-overlay.menu-compact .menu-item.menu-item-save {
        width: 450px;
        padding: 8px 12px;
      }
      .menu-overlay.menu-compact .save-item-thumb {
        width: 80px;
        height: 60px;
      }
      .menu-overlay.menu-compact .save-item-name {
        font-size: 14px;
      }
      .menu-overlay.menu-compact .save-item-info {
        font-size: 10px;
      }
      .menu-overlay.menu-compact .menu-save-list-container {
        max-height: calc(100% - 100px);
      }
      .menu-item:focus-visible {
        outline: 1px solid #ffffff;
        outline-offset: 2px;
      }
      .menu-item.menu-item-save {
        width: 600px;
        min-height: 50px;
        height: auto;
        line-height: 1.4;
        padding: 12px 16px;
        text-align: left;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .menu-item.menu-item-save:hover,
      .menu-item.menu-item-save.is-selected {
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .save-item-name {
        font-size: 16px;
        color: var(--ui-color);
      }
      .save-item-info {
        font-size: 12px;
        color: var(--ui-muted);
      }
      .save-item-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .save-item-thumb {
        width: 100px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
      }
      .save-item-thumb-placeholder {
        background: rgba(0, 0, 0, 0.2);
        border: 1px dashed rgba(255, 255, 255, 0.1);
      }
      #canvasBottom {
        width: 800px;
        display: none;
        transition: width 0s;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        box-sizing: border-box;
      }
      #gameContainer.is-development #canvasBottom {
        display: flex;
      }
      #pageInfo {
        flex-shrink: 0;
      }
      #pageLanguageControl {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        color: #000;
        font-size: 12px;
      }
      #pageLanguageSelect {
        border: 1px solid #999;
        border-radius: 0;
        background: #eee;
        color: #222;
        font: inherit;
        padding: 1px 4px;
      }
      #info {
        color: #000;
        font-family: inherit;
        font-size: 14px;
        padding: 0;
        border: none;
        box-sizing: border-box;
      }
      #mapPanel {
        font-family: monospace;
        font-size: 12px;
        color: #333;
        min-width: 220px;
        box-sizing: border-box;
      }
      .map-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        padding-bottom: 3px;
        border-bottom: 1px solid #ccc;
      }
      .map-panel-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .map-panel-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .map-panel-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        color: #333;
      }
      .map-panel-btn {
        cursor: pointer;
        border: 1px solid #999;
        background: none;
        font-family: monospace;
        font-size: 11px;
        padding: 1px 6px;
        color: #333;
        flex-shrink: 0;
      }
      .map-panel-btn:hover {
        background: #eee;
      }
      .map-panel-status {
        font-size: 11px;
        color: #666;
      }
      #controlPanel {
        display: none;
        border: 1px solid #ccc;
        padding: 5px;
        width: 350px;
        height: 100vh;
        overflow-y: auto;
        font-size: 12px;
        box-sizing: border-box;
      }
      #gameContainer.is-development #controlPanel {
        display: block;
      }
      #controlPanel h3 {
        margin: 0 0 5px 0;
        font-size: 14px;
      }
      details {
        margin: 5px 0;
        border: 1px solid #ddd;
        padding: 3px;
      }
      summary {
        font-weight: bold;
        cursor: pointer;
        font-size: 12px;
        padding: 3px;
      }
      .control-group {
        margin-bottom: 8px;
        padding: 0 5px;
      }
      .control-group label {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
      }
      .control-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 2px;
      }
      .control-label-row label {
        min-width: 0;
        margin-bottom: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .param-reset-button {
        flex-shrink: 0;
        margin: 0;
        border: 1px solid #999;
        background: #eee;
        color: #333;
        font-size: 10px;
        line-height: 14px;
        cursor: pointer;
      }
      .param-reset-button:hover {
        background: #ddd;
      }
      .control-inputs {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .control-group input[type='range'] {
        flex: 1;
      }
      .control-group input[type='number'] {
        width: 80px;
        font-size: 11px;
        flex-shrink: 0;
      }
      .needs-restart {
        color: #f90;
        font-size: 10px;
      }
      button {
        font-size: 11px;
        padding: 2px 4px;
        margin: 2px;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-bottom: 5px;
      }
      .button-row button {
        flex: 1;
        margin: 0;
      }
      /* Editor Styles */
      #editorOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        display: none;
      }
      #editorOverlay.is-visible {
        display: block;
      }
      .editor-content {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .editor-sidebar {
        width: 190px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        padding: 20px 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.35);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        pointer-events: auto;
        z-index: 3;
      }
      .editor-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .editor-panel-toggle {
        height: 28px;
        line-height: 28px;
        font-size: 12px;
        color: var(--ui-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 10px;
        cursor: pointer;
        font-family: var(--ui-font);
        box-sizing: border-box;
      }
      .editor-panel-toggle:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      .editor-panel-toggle.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .editor-panel-collapsed {
        position: absolute;
        left: 12px;
        top: 12px;
        height: 30px;
        line-height: 30px;
        font-size: 12px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 12px;
        cursor: pointer;
        font-family: var(--ui-font);
        box-sizing: border-box;
        display: none;
        pointer-events: auto;
        z-index: 4;
      }
      .editor-panel-collapsed.is-visible {
        display: block;
      }
      .editor-panel-collapsed:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      .editor-environment-palette {
        position: absolute;
        top: 12px;
        left: 204px;
        right: 12px;
        min-height: 42px;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-sizing: border-box;
        pointer-events: auto;
        z-index: 4;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .editor-environment-palette.is-visible {
        display: flex;
      }
      .editor-environment-palette-item {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ui-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
        cursor: pointer;
        box-sizing: border-box;
      }
      .editor-environment-palette-item:hover,
      .editor-environment-palette-item.is-selected {
        color: var(--ui-color);
        background: rgba(240, 220, 180, 0.14);
        border-color: rgba(240, 220, 180, 0.55);
      }
      .editor-environment-palette-create {
        margin-left: 4px;
        border-style: dashed;
      }
      .editor-environment-palette-icon {
        width: 32px;
        height: 32px;
        display: block;
        pointer-events: none;
      }
      .editor-environment-property-panel {
        position: absolute;
        top: 60px;
        right: 12px;
        min-width: 238px;
        max-width: 280px;
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.56);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-family: var(--ui-font);
        pointer-events: auto;
        z-index: 4;
        box-sizing: border-box;
      }
      .editor-environment-property-panel.is-visible {
        display: flex;
      }
      .editor-environment-property-title {
        height: 16px;
        line-height: 16px;
        font-size: 11px;
        color: var(--ui-color);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .editor-environment-property-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .editor-environment-property-section {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .editor-environment-property-common-section {
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px dashed rgba(255, 255, 255, 0.22);
      }
      .editor-environment-property-section-title {
        height: 16px;
        line-height: 16px;
        font-size: 11px;
        color: var(--ui-color);
      }
      .editor-environment-property-row {
        min-height: 22px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .editor-environment-property-row input {
        width: 13px;
        height: 13px;
        margin: 0;
