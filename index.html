<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SL2D Game</title>
    <style>
      :root {
        --ui-font: monospace;
        --ui-color: #ffffff;
        --ui-muted: #aaaaaa;
        --ui-dim: rgba(11, 12, 14, 0.2);
        --ui-highlight: rgba(128, 128, 128, 0.8);
      }
      body {
        margin: 0;
        padding: 5px;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) rgba(0, 0, 0, 0.2);
      }
      #gameContainer {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      canvas {
        flex-shrink: 0;
        display: block;
      }
      #canvasColumn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        flex-shrink: 0;
      }
      #gameViewport {
        position: relative;
        width: 800px;
        height: 600px;
        flex-shrink: 0;
        overflow: hidden;
        background: #0d0b18;
      }
      #gameViewport:fullscreen {
        width: 100% !important;
        height: 100% !important;
      }
      #gameCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: none;
      }
      .ui-layer.is-interactive {
        display: block;
        pointer-events: auto;
      }
      .ui-text-muted {
        color: var(--ui-muted);
      }
      .menu-overlay {
        position: absolute;
        inset: 0;
        font-family: var(--ui-font);
        color: var(--ui-color);
        opacity: 0;
        pointer-events: none;
      }
      .menu-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }
      .menu-dim {
        position: absolute;
        inset: 0;
        background: var(--ui-dim);
      }
      .menu-title {
        position: absolute;
        left: 50%;
        font-size: 150px;
        font-weight: bold;
        line-height: 1;
        transform: translate(-50%, -50%);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }
      .menu-title.menu-title-compact {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .menu-items {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .menu-save-list-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-sizing: border-box;
        pointer-events: auto;
        max-height: calc(100% - 140px);
      }
      .menu-save-list-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
      }
      .menu-save-list {
        position: relative;
        display: block;
        gap: 0;
        max-height: calc(100% - 60px);
        overflow: auto;
      }
      .menu-save-list .menu-item {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        text-align: left;
        margin: 0 auto;
      }
      .menu-save-list .menu-item.menu-item-save {
        width: 600px;
      }
      .menu-save-actions {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: none;
        gap: 8px;
        pointer-events: auto;
        z-index: 4;
      }
      .menu-save-actions.is-visible {
        display: flex;
      }
      .menu-save-actions .menu-item {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
      }
      .menu-item.menu-item-save-new {
        position: relative;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        box-sizing: border-box;
        width: auto;
        transform: none;
        left: auto;
      }
      .menu-item.menu-item-save-delete {
        position: relative;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        color: #d98b8b;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(190, 68, 68, 0.8);
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        box-sizing: border-box;
        width: auto;
        transform: none;
        left: auto;
      }
      .menu-item.menu-item-save-new:hover,
      .menu-item.menu-item-save-new.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .menu-item.menu-item-save-delete:hover,
      .menu-item.menu-item-save-delete.is-selected {
        color: #ffd0d0;
        background: var(--ui-highlight);
        border-color: rgba(245, 92, 92, 0.95);
      }
      .menu-item.menu-item-save-delete:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .menu-item.menu-item-back {
        position: absolute;
        left: 12px;
        bottom: 12px;
        transform: none;
      }
      .menu-item {
        position: absolute;
        left: 50%;
        width: 300px;
        height: 30px;
        line-height: 30px;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: var(--ui-muted);
        background: transparent;
        border: none;
        padding: 0 12px;
        cursor: pointer;
        text-align: center;
        font-family: var(--ui-font);
        pointer-events: auto;
      }
      .menu-item.menu-item-value {
        width: 420px;
        display: grid;
        grid-template-columns: 148px 12px 1fr;
        align-items: center;
        gap: 8px;
        text-align: left;
      }
      .menu-item.menu-item-cycle {
        grid-template-columns: 148px 12px 1fr;
      }
      .menu-item-value-label {
        text-align: right;
        pointer-events: none;
      }
      .menu-item-value-colon {
        text-align: center;
        pointer-events: none;
      }
      .menu-item-value-content {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
      }
      .menu-item-static-value {
        pointer-events: none;
      }
      .menu-item-cycle-controls {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        min-width: 144px;
      }
      .menu-item-cycle-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: var(--ui-muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: auto;
      }
      .menu-item:hover .menu-item-cycle-arrow,
      .menu-item.is-selected .menu-item-cycle-arrow {
        color: var(--ui-color);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .menu-item-cycle-value {
        min-width: 80px;
        text-align: center;
        pointer-events: none;
      }
      .menu-item.menu-item-back {
        width: auto;
        height: 34px;
        line-height: 34px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
      }
      .menu-item.menu-item-back.is-selected,
      .menu-item.menu-item-back:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .menu-item.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      /* Small screen compact styles */
      .menu-overlay.menu-compact .menu-title {
        font-size: 80px;
      }
      .menu-overlay.menu-compact .menu-item {
        font-size: 16px;
        height: 26px;
        line-height: 26px;
      }
      .menu-overlay.menu-compact .menu-item.menu-item-value,
      .menu-overlay.menu-compact .menu-item.menu-item-cycle {
        width: 340px;
        grid-template-columns: 116px 10px 1fr;
        gap: 6px;
      }
      .menu-overlay.menu-compact .menu-item-cycle-controls {
        min-width: 118px;
      }
      .menu-overlay.menu-compact .menu-item-cycle-arrow {
        width: 20px;
        height: 20px;
      }
      .menu-overlay.menu-compact .menu-item.menu-item-save {
        width: 450px;
        padding: 8px 12px;
      }
      .menu-overlay.menu-compact .save-item-thumb {
        width: 80px;
        height: 60px;
      }
      .menu-overlay.menu-compact .save-item-name {
        font-size: 14px;
      }
      .menu-overlay.menu-compact .save-item-info {
        font-size: 10px;
      }
      .menu-overlay.menu-compact .menu-save-list-container {
        max-height: calc(100% - 100px);
      }
      .menu-item:focus-visible {
        outline: 1px solid #ffffff;
        outline-offset: 2px;
      }
      .menu-item.menu-item-save {
        width: 600px;
        min-height: 50px;
        height: auto;
        line-height: 1.4;
        padding: 12px 16px;
        text-align: left;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .menu-item.menu-item-save:hover,
      .menu-item.menu-item-save.is-selected {
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .save-item-name {
        font-size: 16px;
        color: var(--ui-color);
      }
      .save-item-info {
        font-size: 12px;
        color: var(--ui-muted);
      }
      .save-item-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .save-item-thumb {
        width: 100px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
      }
      .save-item-thumb-placeholder {
        background: rgba(0, 0, 0, 0.2);
        border: 1px dashed rgba(255, 255, 255, 0.1);
      }
      #canvasBottom {
        width: 800px;
        display: flex;
        transition: width 0s;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        box-sizing: border-box;
      }
      #info {
        color: #000;
        font-family: inherit;
        font-size: 14px;
        padding: 0;
        border: none;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      #mapPanel {
        font-family: monospace;
        font-size: 12px;
        color: #333;
        min-width: 220px;
        box-sizing: border-box;
      }
      .map-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        padding-bottom: 3px;
        border-bottom: 1px solid #ccc;
      }
      .map-panel-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .map-panel-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .map-panel-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        color: #333;
      }
      .map-panel-btn {
        cursor: pointer;
        border: 1px solid #999;
        background: none;
        font-family: monospace;
        font-size: 11px;
        padding: 1px 6px;
        color: #333;
        flex-shrink: 0;
      }
      .map-panel-btn:hover {
        background: #eee;
      }
      .map-panel-status {
        font-size: 11px;
        color: #666;
      }
      #controlPanel {
        border: 1px solid #ccc;
        padding: 5px;
        width: 350px;
        height: 100vh;
        overflow-y: auto;
        font-size: 12px;
        box-sizing: border-box;
      }
      #controlPanel h3 {
        margin: 0 0 5px 0;
        font-size: 14px;
      }
      details {
        margin: 5px 0;
        border: 1px solid #ddd;
        padding: 3px;
      }
      summary {
        font-weight: bold;
        cursor: pointer;
        font-size: 12px;
        padding: 3px;
      }
      .control-group {
        margin-bottom: 8px;
        padding: 0 5px;
      }
      .control-group label {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
      }
      .control-inputs {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .control-group input[type='range'] {
        flex: 1;
      }
      .control-group input[type='number'] {
        width: 80px;
        font-size: 11px;
        flex-shrink: 0;
      }
      .needs-restart {
        color: #f90;
        font-size: 10px;
      }
      button {
        font-size: 11px;
        padding: 2px 4px;
        margin: 2px;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-bottom: 5px;
      }
      .button-row button {
        flex: 1;
        margin: 0;
      }
      /* Editor Styles */
      #editorOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        display: none;
      }
      #editorOverlay.is-visible {
        display: block;
      }
      .editor-content {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .editor-sidebar {
        width: 190px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        padding: 20px 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.35);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        pointer-events: auto;
        z-index: 3;
      }
      .editor-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .editor-panel-toggle {
        height: 28px;
        line-height: 28px;
        font-size: 12px;
        color: var(--ui-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 10px;
        cursor: pointer;
        font-family: var(--ui-font);
        box-sizing: border-box;
      }
      .editor-panel-toggle:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      .editor-panel-toggle.is-selected {
        color: var(--ui-color);
        background: var(--ui-highlight);
        border-color: rgba(255, 255, 255, 0.32);
      }
      .editor-panel-collapsed {
        position: absolute;
        left: 12px;
        top: 12px;
        height: 30px;
        line-height: 30px;
        font-size: 12px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0 12px;
        cursor: pointer;
        font-family: var(--ui-font);
        box-sizing: border-box;
        display: none;
        pointer-events: auto;
        z-index: 4;
      }
      .editor-panel-collapsed.is-visible {
        display: block;
      }
      .editor-panel-collapsed:hover {
        color: var(--ui-color);
        background: var(--ui-highlight);
      }
      .editor-environment-palette {
        position: absolute;
        top: 12px;
        left: 204px;
        right: 12px;
        min-height: 42px;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-sizing: border-box;
        pointer-events: auto;
        z-index: 4;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .editor-environment-palette.is-visible {
        display: flex;
      }
      .editor-environment-palette-item {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ui-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
        cursor: pointer;
        box-sizing: border-box;
      }
      .editor-environment-palette-item:hover,
      .editor-environment-palette-item.is-selected {
        color: var(--ui-color);
        background: rgba(240, 220, 180, 0.14);
        border-color: rgba(240, 220, 180, 0.55);
      }
      .editor-environment-palette-create {
        margin-left: 4px;
        border-style: dashed;
      }
      .editor-environment-palette-icon {
        width: 32px;
        height: 32px;
        display: block;
        pointer-events: none;
      }
      .global-tooltip {
        position: fixed;
        display: none;
        max-width: 180px;
        min-height: 22px;
        line-height: 22px;
        padding: 0 8px;
        font-size: 12px;
        color: var(--ui-color);
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-family: var(--ui-font);
        white-space: nowrap;
        pointer-events: none;
        z-index: 12000;
        box-sizing: border-box;
      }
      .global-tooltip.is-visible {
        display: block;
      }
      .editor-object-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .editor-object-panel {
        display: flex;
        flex-direction: column;
        height: calc(100% - 40px);
        min-height: 0;
      }
      .editor-depth-filter {
        flex-shrink: 0;
        margin: 0 0 6px 12px;
        height: 24px;
        font-size: 11px;
        font-family: var(--ui-font);
        color: var(--ui-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        padding: 0 4px;
        width: calc(100% - 12px);
        box-sizing: border-box;
      }
      .editor-depth-filter:hover {
        color: var(--ui-color);
        border-color: rgba(255, 255, 255, 0.4);
      }
      .editor-depth-filter option {
        background: #1a1a1a;
        color: var(--ui-color);
      }
      .editor-object-tree {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding-right: 4px;
        padding-left: 12px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .editor-object-group {
        margin: 0;
        padding: 0;
        border: none;
      }
      .editor-object-group > summary {
        list-style: none;
        margin: 0;
        padding: 0;
        cursor: pointer;
        display: grid;
        grid-template-columns: 12px 1fr;
        align-items: center;
        height: 24px;
        margin-left: -12px;
        width: calc(100% + 12px);
      }
      .editor-object-group > summary::-webkit-details-marker {
        display: none;
      }
      .editor-object-toggle {
        width: 12px;
        height: 24px;
        padding: 0;
        margin: 0;
        background: transparent;
        border: none;
        color: var(--ui-muted);
        font: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .editor-object-toggle::before {
        content: '▸';
      }
      .editor-object-group[open] > summary .editor-object-toggle::before {
        content: '▾';
      }
      .editor-object-children {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding-left: 12px;
      }
      .editor-object-node {
        width: 100%;
        height: 24px;
        line-height: 24px;
        font-size: 12px;
        color: var(--ui-muted);
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0 8px;
        margin: 0;
        cursor: pointer;
        text-align: left;
        font-family: var(--ui-font);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .editor-object-group .editor-object-node {
        flex: 1;
      }
      .editor-object-label {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .editor-object-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .editor-object-group-icon {
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 1px dashed rgba(255, 255, 255, 0.55);
        opacity: 0.85;
        flex-shrink: 0;
      }
      .editor-object-lock-icon {
        position: relative;
        width: 9px;
        height: 7px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 1px;
        opacity: 0.9;
      }
      .editor-object-lock-icon::before {
        content: '';
        position: absolute;
        left: 1px;
        right: 1px;
        top: -6px;
        height: 6px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-bottom: none;
        border-radius: 6px 6px 0 0;
      }
      .editor-object-node:hover {
        color: var(--ui-color);
        border-color: rgba(255, 255, 255, 0.28);
        background: var(--ui-highlight);
      }
      .editor-object-node.is-selected {
        color: var(--ui-color);
        border-color: rgba(255, 255, 255, 0.28);
        background: var(--ui-highlight);
      }

              <input
                type="number"
                id="ropeDampingRatioNum"
                min="0"
                max="2"
                step="0.05"
                value="0.5"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="control-group">
            <label for="swingForce" title="按方向键时施加的摆荡推力大小"
              >摆荡推力</label
            >
            <div class="control-inputs">
              <input
                type="range"
                id="swingForce"
                min="100"
                max="3000"
                step="50"
                value="2000"
                autocomplete="off"
              />
              <input
                type="number"
                id="swingForceNum"
                min="100"
                max="5000"
                step="50"
                value="2000"
                autocomplete="off"
              />
            </div>
          </div>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
